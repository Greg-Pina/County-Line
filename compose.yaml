services:
  db:
    image: postgres:16-alpine
    container_name: county-line-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: county_line
      POSTGRES_PASSWORD: county_line
      POSTGRES_DB: county_line
    ports:
      - "5432:5432"
    volumes:
      - county-line-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U county_line -d county_line"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  county-line-postgres:
